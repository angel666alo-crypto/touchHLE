name: Build touchHLE

on:
  workflow_dispatch:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:

    runs-on: ubuntu-latest

    steps:
    - name: Disable CRLF conversion
      shell: bash
      run: git config --global core.autocrlf false
    # actions/checkout really doesn't work well with git-describe for some
    # reason (most likely it strips the annotation off the tag somehow).
    - name: Checkout touchHLE
      shell: bash # windows :)
      run: |
        mkdir -p "$GITHUB_WORKSPACE"
        git clone "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE"
        cd "$GITHUB_WORKSPACE"
        git fetch origin "$GITHUB_REF"
        git checkout "$GITHUB_SHA" # avoid race condition if branch/tag changes
    - name: Restore original sources and apply the World of Tunes patch
      shell: bash
      run: |
        git fetch --depth 1 https://github.com/touchHLE/touchHLE ca1de89c578e79746f33c1332e28efd106c334ba
        git checkout FETCH_HEAD -- src/lib.rs src/frameworks/avfoundation/av_audio_player.rs src/frameworks/core_foundation/cf_bundle.rs src/frameworks/core_foundation/cf_url.rs src/frameworks/foundation/ns_file_handle.rs src/frameworks/foundation/ns_string.rs src/frameworks/openal.rs src/frameworks/uikit/ui_font.rs
