        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p wot_dl && gh release download ipa --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir wot_dl && mv wot_dl/*.ipa touchHLE_windows_bundle/wot.ipa || echo "No hay release 'ipa': se compila sin el juego incluido"
        ls -la touchHLE_windows_bundle
    - uses: actions/upload-artifact@v4
      with:
        name: WorldOfTunes_Windows_x86_64
        path: touchHLE_windows_bundle/
    - uses: actions/upload-artifact@v4
      with:
        name: TestApp_built_on_Windows
        path: tests/TestApp.app
