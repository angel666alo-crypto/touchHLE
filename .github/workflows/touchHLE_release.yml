    - name: World of Tunes edition (name, icon, bundled game)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sed -i 's|resValue("string", "app_name", join("touchHLE", " ", branding))|resValue("string", "app_name", "World of Tunes")|' android/app/build.gradle.kts
        sed -i 's|applicationId = "org.touchhle.android"|applicationId = "org.fan.worldoftunes"|' android/app/build.gradle.kts
        sed -i 's|    namespace = "org.touchhle.android"|    namespace = "org.touchhle.android"\n    androidResources { noCompress += "ipa" }|' android/app/build.gradle.kts
        echo '' | base64 -d > android/app/src/main/res/drawable-nodpi/icon.png
        cp android/app/src/main/res/drawable-nodpi/icon.png android/app/src/main/res/drawable-nodpi/icon_unofficial.png
        cp android/app/src/main/res/drawable-nodpi/icon.png android/app/src/main/res/drawable-nodpi/icon_preview.png
        rm -f android/app/src/main/assets/wot.ipa
        mkdir -p wot_dl && gh release download ipa --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir wot_dl && mv wot_dl/*.ipa android/app/src/main/assets/wot.ipa || echo "No hay release 'ipa': se compila sin el juego incluido"
        ls -la android/app/src/main/assets
        grep -n "app_name\|applicationId\|noCompress" android/app/build.gradle.kts
    - name: Check formatting
      run: dev-scripts/format.sh --check
    - name: Get Submodules
      run: git submodule update --init
    - name: Try to get cached copy of Boost
      id: cache-boost
      uses: actions/cache@v3
      with:
        path: vendor/boost
        key: boost_1_81_0
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Download Boost
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Extract Boost
      run: 7z -ovendor x boost_1_81_0.7z && mv vendor/boost_1_81_0 vendor/boost
    - name: Try to get cached copy of cmake
      id: cache-cmake
      uses: actions/cache@v3
      with:
        path: vendor/cmake
        key: cmake_3_31_6_linux
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Download Cmake
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Extract Cmake
      run: tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake
    - name: Install AArch64 Android Rust toolchain
      run: rustup target add aarch64-linux-android
    - name: Install cargo-ndk
      run: cargo install cargo-ndk@3.5.4
    # Gradle version compatibility is a nightmare and we refuse to use gradlew.
    - name: Try to get a cached copy of Gradle
      id: cache-gradle
      uses: actions/cache@v3
      with:
        path: gradle
        key: gradle-8.11.1
    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}
      name: Download Gradle
      run: curl -L -o gradle-8.11.1-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}
      name: Extract Gradle
      run: 7z -ogradle x gradle-8.11.1-bin.zip
    # We need to install the correct version of Android NDK manually
    - name: Try to get a cached copy of Android NDK
      id: cache-android-ndk
      uses: actions/cache@v3
      with:
        path: android-ndk
        key: android-ndk-r25c
    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}
      name: Download Android NDK
      run: curl -L -o android-ndk-r25c-linux.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"
    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}
      name: Extract Android NDK
      run: 7z -oandroid-ndk -snld x android-ndk-r25c-linux.zip
    - name: Link Android NDK
